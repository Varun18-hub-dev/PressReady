name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build (C++ extension via CMake + pybind11) and install
        run: pip install .[test]
      - name: Check the C++ engine loaded
        run: python -c "import pressready, sys; print(pressready.BACKEND); sys.exit(pressready.BACKEND != 'c++')"
      - name: Test
        run: pytest -q
      - name: Preflight the sample jobs
        shell: bash
        run: |
          python examples/make_samples.py out
          pressready out/good_job.pdf
          pressready out/bad_job.pdf --html out/bad_job.html || test $? -eq 2
